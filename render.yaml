# Render 블루프린트: GitHub 저장소를 연결하면 웹 서비스와 PostgreSQL이 함께 만들어진다.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: chalkak
    runtime: docker
    plan: free            # 무료: 15분 미사용 시 잠들고, 첫 접속 때 30초~1분 깨어남
    region: singapore     # 한국에서 가장 가까운 리전
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chalkak-db
          property: connectionString
      - key: SIGNUP_CODE   # 새 업장 개설 코드: 이 코드로 가입하면 입력한 호텔·업장이 새로 만들어지고 관리자가 된다.
                           # 이후 구성원은 그 업장 관리자가 발급한 업장 가입 코드로 가입한다 (Render가 처음에 입력을 요청)
        sync: false
      # 가입 문자 인증 (server/sms.js). 설정하지 않으면 운영 환경에서는 인증번호를 보낼 수 없어 가입이 막힌다
      - key: SMS_PROVIDER  # solapi 또는 twilio
        sync: false
      - key: SMS_FROM      # 문자 업체에 등록한 발신번호
        sync: false
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false

databases:
  - name: chalkak-db
    plan: free            # 무료 DB는 30일 후 만료 — 계속 쓰려면 유료 플랜(basic-256mb 등)으로 변경
    region: singapore
    databaseName: docscan
    user: docscan
    postgresMajorVersion: "16"
    ipAllowList: []       # 외부 접속 차단, Render 내부에서만 접근
