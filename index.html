<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="고지서, 지로, 거래명세서를 촬영하면 내용을 읽어 자동으로 저장합니다.">
  <title>찰칵장부</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <!-- iOS 홈 화면 앱 -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="찰칵장부">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabbar">
      <a href="#/" data-tab="home"><span class="ico">▤</span><span>문서함</span></a>
      <a href="#/inventory" data-tab="inventory"><span class="ico">▦</span><span>재고</span></a>
      <a href="#/camera" class="shoot" aria-label="촬영"><span class="shutter-mini"></span></a>
      <a href="#/queue" data-tab="queue"><span class="ico">✓</span><span>검수</span><b id="queueBadge" hidden></b></a>
      <a href="#/me" data-tab="me"><span class="ico">☺</span><span>내 정보</span></a>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="/js/paddle.js"></script>
  <script src="/js/db.js"></script>
  <script src="/js/policy.js"></script>
  <script src="/js/parser.js"></script>
  <script src="/js/ocr.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.warn));
    }
  </script>
</body>
</html>
